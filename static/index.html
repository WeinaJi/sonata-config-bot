<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONATA Config Chatbot</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Reset & base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f7fa;
      --surface:     #ffffff;
      --surface2:    #eef1f6;
      --border:      #dce0e8;
      --accent:      #4361ee;
      --accent-dark: #3451d1;
      --text:        #1e2030;
      --text-muted:  #6b7394;
      --user-bubble: #4361ee;
      --bot-bubble:  #eef1f6;
      --success:     #2eaa6f;
      --error:       #e5484d;
      --radius:      10px;
      --font:        'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ------------------------------------------------------------------ */
    /* Header                                                               */
    /* ------------------------------------------------------------------ */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 14px;
      color: #fff;
    }

    header h1 { font-size: 16px; font-weight: 600; }
    header .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    header .new-btn {
      margin-left: auto;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }
    header .new-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ------------------------------------------------------------------ */
    /* Main split layout                                                    */
    /* ------------------------------------------------------------------ */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ------------------------------------------------------------------ */
    /* Sidebar — session history                                            */
    /* ------------------------------------------------------------------ */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .session-list::-webkit-scrollbar { width: 5px; }
    .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .session-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .12s;
      margin-bottom: 4px;
    }
    .session-item:hover { background: var(--surface2); }
    .session-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }

    .session-item .label {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item .meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-item .config-badge {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    .no-sessions {
      padding: 20px 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ------------------------------------------------------------------ */
    /* Center panel — chat                                                  */
    /* ------------------------------------------------------------------ */
    .chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      border-right: 1px solid var(--border);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--accent); color: #fff; }
    .msg.bot  .avatar { background: var(--surface2); color: var(--text-muted); }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 3px; }
    .msg.bot  .bubble { background: var(--bot-bubble);  border-bottom-left-radius: 3px; }

    /* Typing indicator */
    .typing .bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce .9s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row textarea {
      flex: 1;
      resize: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      height: 44px;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color .15s;
      line-height: 1.5;
    }
    .input-row textarea:focus { border-color: var(--accent); }
    .input-row textarea::placeholder { color: var(--text-muted); }

    .send-btn, .gen-btn {
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 0 18px;
      height: 44px;
      transition: background .15s, opacity .15s;
      white-space: nowrap;
    }
    .send-btn { background: var(--accent); color: #fff; }
    .send-btn:hover { background: var(--accent-dark); }
    .send-btn:disabled { opacity: .4; cursor: default; }

    .gen-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .gen-btn:hover { border-color: var(--success); color: var(--success); }
    .gen-btn:disabled { opacity: .4; cursor: default; }

    /* ------------------------------------------------------------------ */
    /* Right panel — JSON preview                                           */
    /* ------------------------------------------------------------------ */
    .json-panel {
      width: 420px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .json-header {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .json-header span { font-size: 13px; font-weight: 600; flex: 1; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background .3s;
    }
    .status-dot.ready { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.error { background: var(--error);   box-shadow: 0 0 6px var(--error); }

    .dl-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      display: none;
    }
    .dl-btn.visible { display: inline-flex; align-items: center; gap: 5px; }
    .dl-btn:hover { border-color: var(--success); color: var(--success); }

    .json-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
    }
    .json-body::-webkit-scrollbar { width: 6px; }
    .json-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .json-body pre {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .json-placeholder {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 24px;
    }
    .json-placeholder svg { opacity: .3; }

    /* Syntax highlight colours */
    .k { color: #1e40af; }   /* keys   */
    .s { color: #166534; }   /* string */
    .n { color: #c2410c; }   /* number */
    .b { color: #7c3aed; }   /* bool/null */

    /* Validation error box */
    .error-box {
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(229,72,77,.08);
      border: 1px solid var(--error);
      color: var(--error);
      font-size: 12px;
      white-space: pre-wrap;
    }

    /* ------------------------------------------------------------------ */
    /* Responsive                                                           */
    /* ------------------------------------------------------------------ */
    @media (max-width: 1000px) {
      .json-panel { display: none; }
    }
    @media (max-width: 780px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header>
  <div class="logo">S</div>
  <div>
    <h1>SONATA Config Chatbot</h1>
    <div class="subtitle">Describe your simulation — get a valid JSON config</div>
  </div>
  <button class="new-btn" onclick="newSession()">+ New session</button>
</header>

<!-- ===================== MAIN ===================== -->
<main>

  <!-- Sidebar — session history -->
  <nav class="sidebar">
    <div class="sidebar-header">Sessions</div>
    <div class="session-list" id="sessionList">
      <div class="no-sessions">No sessions yet</div>
    </div>
  </nav>

  <!-- Chat panel -->
  <section class="chat-panel">
    <div class="messages" id="messages"></div>

    <div class="input-row">
      <textarea
        id="userInput"
        placeholder="Describe your simulation or answer the assistant's questions…"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="gen-btn" id="genBtn" onclick="generateConfig()" title="Extract & validate config now">
        Generate JSON
      </button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </section>

  <!-- JSON preview panel -->
  <aside class="json-panel">
    <div class="json-header">
      <div class="status-dot" id="statusDot"></div>
      <span>simulation_config.json</span>
      <a class="dl-btn" id="dlBtn" href="#" download="simulation_config.json">
        ↓ Download
      </a>
    </div>
    <div class="json-body" id="jsonBody">
      <div class="json-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <p>Your config will appear here<br>once the assistant has enough information.</p>
      </div>
    </div>
  </aside>

</main>

<script>
  // -----------------------------------------------------------------------
  // State
  // -----------------------------------------------------------------------
  let sessionId = null;
  let busy = false;

  // -----------------------------------------------------------------------
  // Boot
  // -----------------------------------------------------------------------
  window.addEventListener('DOMContentLoaded', () => newSession());

  // -----------------------------------------------------------------------
  // Session management
  // -----------------------------------------------------------------------
  async function newSession() {
    clearMessages();
    clearJsonPanel();
    sessionId = null;
    busy = false;
    setInputEnabled(false);

    try {
      const res = await fetch('/session', { method: 'POST' });
      const data = await res.json();
      sessionId = data.session_id;
      appendMessage('bot', data.reply);
      await refreshSessionList();
    } catch (e) {
      appendMessage('bot', '\u26a0\ufe0f Could not connect to the server. Is it running?');
    } finally {
      setInputEnabled(true);
    }
  }

  async function switchSession(sid) {
    if (sid === sessionId) return;
    sessionId = sid;
    clearMessages();
    clearJsonPanel();
    setInputEnabled(false);

    try {
      // Load messages
      const msgRes = await fetch(`/session/${sid}/messages`);
      const messages = await msgRes.json();
      for (const m of messages) {
        appendMessage(m.role === 'user' ? 'user' : 'bot', m.content);
      }

      // Check if config exists via the sessions list data
      const sessRes = await fetch('/sessions');
      const sessions = await sessRes.json();
      const current = sessions.find(s => s.session_id === sid);
      if (current && current.has_config) {
        const configRes = await fetch(`/download/${sid}`);
        if (configRes.ok) {
          const config = await configRes.json();
          renderConfig(config);
        }
      }

      highlightActiveSession(sid);
    } catch (e) {
      appendMessage('bot', '\u26a0\ufe0f Failed to load session.');
    } finally {
      setInputEnabled(true);
    }
  }

  async function refreshSessionList() {
    try {
      const res = await fetch('/sessions');
      const sessions = await res.json();
      const list = document.getElementById('sessionList');

      if (sessions.length === 0) {
        list.innerHTML = '<div class="no-sessions">No sessions yet</div>';
        return;
      }

      list.innerHTML = sessions.map(s => {
        const time = formatTime(s.created_at);
        const active = s.session_id === sessionId ? ' active' : '';
        const badge = s.has_config ? '<span class="config-badge" title="Config generated"></span>' : '';
        return `
          <div class="session-item${active}" data-sid="${s.session_id}" onclick="switchSession('${s.session_id}')">
            <div class="label">${escapeHtml(s.label)}</div>
            <div class="meta">${badge}${time}</div>
          </div>`;
      }).join('');
    } catch (e) { /* ignore */ }
  }

  function highlightActiveSession(sid) {
    document.querySelectorAll('.session-item').forEach(el => {
      el.classList.toggle('active', el.dataset.sid === sid);
    });
  }

  // -----------------------------------------------------------------------
  // Send message
  // -----------------------------------------------------------------------
  async function sendMessage() {
    const textarea = document.getElementById('userInput');
    const text = textarea.value.trim();
    if (!text || busy || !sessionId) return;

    textarea.value = '';
    autoResize(textarea);
    appendMessage('user', text);
    showTyping();
    setInputEnabled(false);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      removeTyping();
      appendMessage('bot', data.reply);

      if (data.config) {
        renderConfig(data.config);
      }

      // Refresh sidebar to update label
      await refreshSessionList();
    } catch (e) {
      removeTyping();
      appendMessage('bot', '\u26a0\ufe0f Request failed. Please try again.');
    } finally {
      setInputEnabled(true);
      document.getElementById('userInput').focus();
    }
  }

  // -----------------------------------------------------------------------
  // Generate config explicitly
  // -----------------------------------------------------------------------
  async function generateConfig() {
    if (busy || !sessionId) return;
    showTyping();
    setInputEnabled(false);

    try {
      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
      });
      const data = await res.json();
      removeTyping();

      if (data.config) {
        renderConfig(data.config);
        appendMessage('bot', '\u2705 Config generated and validated. You can download it from the panel on the right.');
        await refreshSessionList();
      } else {
        renderError(data.error || 'Unknown error.');
        appendMessage('bot', `\u26a0\ufe0f Config generation failed:\n\n${data.error}\n\nLet's keep refining \u2014 tell me what to fix.`);
      }
    } catch (e) {
      removeTyping();
      appendMessage('bot', '\u26a0\ufe0f Request failed. Please try again.');
    } finally {
      busy = false;
      setInputEnabled(true);
    }
  }

  // -----------------------------------------------------------------------
  // DOM helpers — messages
  // -----------------------------------------------------------------------
  function appendMessage(role, text) {
    const container = document.getElementById('messages');
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'U' : 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    busy = true;
    const container = document.getElementById('messages');
    const msg = document.createElement('div');
    msg.className = 'msg bot typing';
    msg.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    busy = false;
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function clearMessages() {
    document.getElementById('messages').innerHTML = '';
  }

  // -----------------------------------------------------------------------
  // DOM helpers — JSON panel
  // -----------------------------------------------------------------------
  function renderConfig(config) {
    const dot = document.getElementById('statusDot');
    const dlBtn = document.getElementById('dlBtn');
    const body = document.getElementById('jsonBody');

    dot.className = 'status-dot ready';

    dlBtn.href = `/download/${sessionId}`;
    dlBtn.className = 'dl-btn visible';

    const pretty = JSON.stringify(config, null, 2);
    body.innerHTML = `<pre>${syntaxHighlight(pretty)}</pre>`;
  }

  function renderError(errorText) {
    const dot = document.getElementById('statusDot');
    const body = document.getElementById('jsonBody');
    dot.className = 'status-dot error';
    body.innerHTML = `<div class="error-box">${escapeHtml(errorText)}</div>`;
  }

  function clearJsonPanel() {
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('dlBtn').className = 'dl-btn';
    document.getElementById('jsonBody').innerHTML = `
      <div class="json-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <p>Your config will appear here<br>once the assistant has enough information.</p>
      </div>`;
  }

  // -----------------------------------------------------------------------
  // Input helpers
  // -----------------------------------------------------------------------
  function setInputEnabled(enabled) {
    document.getElementById('sendBtn').disabled = !enabled;
    document.getElementById('genBtn').disabled = !enabled;
    document.getElementById('userInput').disabled = !enabled;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  // -----------------------------------------------------------------------
  // Utilities
  // -----------------------------------------------------------------------
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
         + ' ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function syntaxHighlight(json) {
    return escapeHtml(json).replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      (match) => {
        if (/^"/.test(match)) {
          return /:$/.test(match)
            ? `<span class="k">${match}</span>`
            : `<span class="s">${match}</span>`;
        }
        if (/true|false|null/.test(match)) return `<span class="b">${match}</span>`;
        return `<span class="n">${match}</span>`;
      }
    );
  }
</script>
</body>
</html>
