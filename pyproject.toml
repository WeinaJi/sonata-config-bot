[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonata-config-bot"
version = "0.1.0"
description = "Chatbot that generates SONATA simulation configuration JSON from natural language."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-groq>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "libsonata",
    "faiss-cpu>=1.7",
    "beautifulsoup4>=4.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",     # Missing type annotation
    "INP001",  # Missing `__init__.py`
    "D",       # pydocstyle
    "CPY001",  # Missing copyright notice at top of file
    "A002",    # Function argument is shadowing a Python builtin
    "N802",    # Function name should be lowercase
    "ERA001",  # comment-out code
    "N803",    # Argument name should be lowercase
    "S101",    # Use of `assert` detected
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception
    "TRY003", # raise-vanilla-args
    "TRY300", # try-consider-else
    "PLR2004", # magic-value-comparison
    "UP007", # non-pep604-annotation-union
]
[tool.ruff.lint.per-file-ignores]
"chatbot.py" = ["T201"] # use print instead of log